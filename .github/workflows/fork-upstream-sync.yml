name: Fork upstream review

on:
  workflow_dispatch:
    inputs:
      source:
        description: Upstream candidate source (dev is manual and may require ancestry review)
        type: choice
        options: [main, dev]
        default: main
        required: true
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read

concurrency:
  group: fork-upstream-review
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.repository == 'rahulrsingh09/Riviamigo' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/hardening/private-telemetry'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.sync.outputs.candidate }}
      base: ${{ steps.sync.outputs.base }}
      safe: ${{ steps.sync.outputs.safe }}
      status: ${{ steps.sync.outputs.status }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - name: Prepare immutable candidate using trusted Git plumbing
        id: sync
        env:
          FORK_SYNC_TOKEN: ${{ github.token }}
          FORK_SYNC_SOURCE: ${{ inputs.source || 'main' }}
        run: |
          git remote add upstream https://github.com/bballdavis/Riviamigo.git
          node scripts/fork-sync-runner.mjs
      - name: Save bounded metadata for review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fork-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-sync.json
          retention-days: 1
          if-no-files-found: warn

  validate:
    needs: propose
    if: needs.propose.outputs.safe == 'true' && needs.propose.outputs.candidate != ''
    permissions:
      contents: read
    uses: ./.github/workflows/fork-ci.yml
    with:
      candidate_sha: ${{ needs.propose.outputs.candidate }}
      baseline_sha: ${{ needs.propose.outputs.base }}

  readiness:
    needs: [propose, validate]
    if: always() && github.repository == 'rahulrsingh09/Riviamigo' && github.event.repository.private == false
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report readiness for the exact candidate
        env:
          CANDIDATE: ${{ needs.propose.outputs.candidate }}
          SYNC_STATUS: ${{ needs.propose.outputs.status }}
          SYNC_RESULT: ${{ needs.propose.result }}
          CI_RESULT: ${{ needs.validate.result }}
        run: |
          python3 - <<'PY'
          import json, os
          ready = os.environ['SYNC_RESULT'] == 'success' and os.environ['CI_RESULT'] == 'success'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Candidate readiness\n\n')
              summary.write('```json\n' + json.dumps({
                  'candidate': os.environ['CANDIDATE'],
                  'sync': os.environ['SYNC_STATUS'] or os.environ['SYNC_RESULT'],
                  'validation': os.environ['CI_RESULT'],
                  'ready_for_maintainer_review': ready,
                  'promoted': False,
                  'deployed': False,
              }, indent=2) + '\n```\n')
              summary.write('Review the sync metadata and exact-SHA checks before promotion.\n')
          if os.environ['SYNC_RESULT'] != 'success' or (os.environ['CANDIDATE'] and not ready):
              raise SystemExit(1)
          PY
