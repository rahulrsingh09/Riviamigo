name: Fork upstream review

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-upstream-review
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'rahulrsingh09/Riviamigo' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: hardening/private-telemetry
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - name: Prepare review branch without running upstream code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/bballdavis/Riviamigo.git
          node scripts/fork-sync-runner.mjs
