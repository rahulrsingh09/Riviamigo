services:
  riviamigo:
    environment:
      JWT_SECRET_FILE: /run/secrets/riviamigo/jwt_private.pem
      JWT_PUBLIC_KEY_FILE: /run/secrets/riviamigo/jwt_public.pem
      AGE_ENCRYPTION_KEY_FILE: /run/secrets/riviamigo/age_key.txt
    volumes:
      - type: bind
        source: ${RIVIAMIGO_KEYS_SOURCE:?Set RIVIAMIGO_KEYS_SOURCE to the separately stored key bundle directory}
        target: /run/secrets/riviamigo
        read_only: true
        bind:
          create_host_path: false
